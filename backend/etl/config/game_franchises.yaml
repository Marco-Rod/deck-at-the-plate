# Configuración versionada de franquicias públicas (plan V2 §37)
# ==============================================================
# 30 franquicias GAME (una por franquicia SOURCE/MLB). Este archivo es la
# fuente de verdad del branding público: nombre, slug, abreviatura y colores.
# El universo GAME es 100% ficticio: source_team_external_id es el mlb_team_id
# real de MLB Stats API, y la ciudad se conserva como referencia, pero nombre,
# abreviatura pública, slug y paleta de colores son inventados y únicos.
# La paleta primary+secondary se eligió maximizando la distancia mínima entre
# los 60 colores (gate en franchise_config_issues).
#
# El id del Team público es determinístico: uuid5(ns, "team:<public_abbreviation>")
# (app/core/identities.py). Cambiar la abreviatura cambia el re-key del Team.
