# alembic.ini — Configuración de Alembic para Deck at the Plate
# ==============================================================
# El esquema de la BD se gestiona EXCLUSIVAMENTE con migraciones Alembic.
# NO uses Base.metadata.create_all (ver app/main.py y app/seeds/*).
#
# Flujo para modificar un modelo (backend/app/models/*):
#   1. Edita el modelo (columna, tabla, índice, etc.)
#   2. Genera la migración:
#        docker compose exec backend alembic revision --autogenerate -m "descripcion"
#   3. Revisa el archivo generado en alembic/versions/ y ajústalo si es preciso
#   4. Aplícala:
#        docker compose exec backend alembic upgrade head
#
# Comandos útiles:
#   Aplicar pendientes:            alembic upgrade head
#   Ver estado (versión actual):   alembic current
#   Aplicar una revisión concreta: alembic upgrade <revision>
#   Retroceder una revisión:       alembic downgrade -1
#   Ver historial:                 alembic history --verbose
#
# RESET TOTAL (reconstruir el esquema desde cero):
#   ⚠️  DROP TABLE NO elimina los tipos ENUM de PostgreSQL, así que
#   "downgrade base + upgrade head" falla con "type cardrarity already exists".
#   Usar siempre un DROP SCHEMA CASCADE:
#       docker exec baseball_db psql -U game_user -d baseball_game \
#         -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
#       docker compose exec backend alembic upgrade head
#   (o usar el script: python app/seeds/reset_tables.py)

[alembic]
# URL de la base de datos. Se sobreescribe con la variable de entorno en env.py.
script_location = alembic

# Formato de timestamp para las migraciones
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Codificación de los archivos de migración
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
