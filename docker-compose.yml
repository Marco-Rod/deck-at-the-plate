version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: baseball_db
    environment:
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_password
      POSTGRES_DB: baseball_game
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_user -d baseball_game"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: baseball_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://game_user:game_password@db:5432/baseball_game
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}  # Definir en archivo .env (ver .env.example)
    depends_on:
      db:
        condition: service_healthy

  pwa:
    build: ./pwa
    container_name: baseball_pwa
    volumes:
      - ./pwa:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: